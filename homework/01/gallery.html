<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邱祺峰 - 媒體櫃</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Noto Sans TC', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 40px;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: rgba(255,255,255,0.6);
      text-decoration: none;
      font-size: 15px;
      transition: color 0.3s;
    }
    .back-btn:hover { color: #fff; }
    h1 {
      color: #fff;
      font-size: 28px;
      font-weight: 700;
    }
    .subtitle {
      color: rgba(255,255,255,0.4);
      font-size: 14px;
      margin-top: 4px;
    }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }
    .photo-card {
      background: rgba(255,255,255,0.06);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
      transition: transform 0.3s ease;
    }
    .photo-card:hover {
      transform: translateY(-4px);
    }
    .photo-card img,
    .photo-card video {
      width: 100%;
      display: block;
      object-fit: cover;
    }
    .photo-card img { aspect-ratio: 4 / 3; }
    .photo-card video { max-height: 300px; }
    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: rgba(255,255,255,0.3);
    }
    .empty-msg .icon { font-size: 64px; margin-bottom: 16px; }
    .empty-msg p { font-size: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="index.html" class="back-btn">← 返回</a>
      <div>
        <h1 id="category-title">相簿</h1>
        <p class="subtitle">將照片/影片放到 photos/ 資料夾即可顯示</p>
      </div>
    </div>
    <div class="photo-grid" id="photo-grid">
      <div class="empty-msg">
        <div class="icon">📸</div>
        <p>尚未加入媒體</p>
        <p style="font-size:13px;margin-top:8px;color:rgba(255,255,255,0.2);">請把照片或影片放到 photos/ 資料夾</p>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const category = params.get('category') || '';

    const titles = {
      photography: '📷 攝影',
      travel: '✈️ 旅遊'
    };
    document.getElementById('category-title').textContent = titles[category] || '📸 媒體櫃';

    const mediaList = {

      photography: [
        { type: 'image', src: 'photos/photography/683175306_1162653976933075_7722957398972912951_n.jpg' },
        { type: 'image', src: 'photos/photography/683767582_1913545722673150_2931050367931900919_n.jpg' },
        { type: 'image', src: 'photos/photography/683818035_980982551104763_7490954027879471677_n.jpg' },
        { type: 'image', src: 'photos/photography/684166118_1370091378363991_7205830379829762659_n.jpg' },
        { type: 'image', src: 'photos/photography/684267916_1294480412161918_4996328183123602208_n.jpg' },
        { type: 'image', src: 'photos/photography/684749774_807962452107940_8241095781879427590_n.jpg' },
        { type: 'image', src: 'photos/photography/686321524_1474260760450281_4030525505166632925_n.jpg' },
        { type: 'image', src: 'photos/photography/687840132_1371448084622807_5998022145711774013_n.jpg' },
        { type: 'image', src: 'photos/photography/689440453_2326732561187491_7147035971209575254_n.jpg' },
        { type: 'image', src: 'photos/photography/689568955_1339517141566593_8503793750559632565_n.jpg' },
        { type: 'image', src: 'photos/photography/691619018_1633236937965019_6582918408557924675_n.jpg' },
      ],
      travel: [
        { type: 'image', src: 'photos/travel/671585090_1323127186547779_1609396781140604693_n.jpg' },
        { type: 'image', src: 'photos/travel/674322615_1506984217733151_5773476699843758552_n.jpg' },
        { type: 'image', src: 'photos/travel/683767582_1913545722673150_2931050367931900919_n.jpg' },
        { type: 'image', src: 'photos/travel/684024894_2841465029525609_473987386052433894_n.jpg' },
        { type: 'image', src: 'photos/travel/684166118_1370091378363991_7205830379829762659_n.jpg' },
        { type: 'image', src: 'photos/travel/684267916_1294480412161918_4996328183123602208_n.jpg' },
        { type: 'image', src: 'photos/travel/684280475_1385638253371111_3614796167665725292_n.jpg' },
        { type: 'image', src: 'photos/travel/685426255_837610639407747_1736419514938008777_n.jpg' },
        { type: 'image', src: 'photos/travel/685655747_1456742266250888_2146398401195849111_n.jpg' },
        { type: 'image', src: 'photos/travel/685796698_904686062592794_1632047052410425144_n.jpg' },
        { type: 'image', src: 'photos/travel/686321524_1474260760450281_4030525505166632925_n.jpg' },
        { type: 'image', src: 'photos/travel/687822928_2405868466577410_2247650251710262447_n.jpg' },
        { type: 'image', src: 'photos/travel/687840132_1371448084622807_5998022145711774013_n.jpg' },
        { type: 'image', src: 'photos/travel/688446329_957527653848452_5995989272142790842_n.jpg' },
        { type: 'image', src: 'photos/travel/688585254_1854931672560169_7230704033270283065_n.jpg' },
        { type: 'image', src: 'photos/travel/689440453_2326732561187491_7147035971209575254_n.jpg' },
        { type: 'image', src: 'photos/travel/689568955_1339517141566593_8503793750559632565_n.jpg' },
        { type: 'image', src: 'photos/travel/690819101_943117015200004_5749363827753437559_n.jpg' },
        { type: 'image', src: 'photos/travel/691533678_1312557217147056_7692710832194053673_n.jpg' },
        { type: 'image', src: 'photos/travel/691619018_1633236937965019_6582918408557924675_n.jpg' },
      ]
    };

    const items = mediaList[category] || [];

    if (items.length > 0) {
      const grid = document.getElementById('photo-grid');
      grid.innerHTML = '';
      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'photo-card';
        if (item.type === 'video') {
          card.innerHTML = `<video src="${item.src}" controls></video>`;
        } else {
          card.innerHTML = `<img src="${item.src}" alt="">`;
        }
        grid.appendChild(card);
      });
    }
  </script>
</body>
</html>
