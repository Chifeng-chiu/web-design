<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邱祺峰 - 個人網頁</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', 'Noto Sans TC', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 50px 40px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: transform 0.3s ease;
    }
    .card:hover {
      transform: translateY(-4px);
    }
    .avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      color: #fff;
      font-weight: 700;
      box-shadow: 0 8px 32px rgba(245, 87, 108, 0.35);
    }
    h1 {
      color: #fff;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .subtitle {
      color: rgba(255, 255, 255, 0.6);
      font-size: 15px;
      letter-spacing: 4px;
      margin-bottom: 32px;
    }
    .divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, #f093fb, #f5576c);
      margin: 0 auto 32px;
      border-radius: 4px;
    }
    .section-title {
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .interests {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .interest-tag {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50px;
      padding: 10px 28px;
      color: #fff;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s ease;
      cursor: default;
    }
    .interest-tag:hover {
      background: rgba(245, 87, 108, 0.25);
      border-color: #f5576c;
      transform: scale(1.05);
    }
    .interest-icon {
      font-size: 22px;
    }
    .footer {
      margin-top: 36px;
      color: rgba(255, 255, 255, 0.3);
      font-size: 13px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">邱</div>
    <h1>邱祺峰</h1>
    <p class="subtitle">CHIU CHI FENG</p>
    <div class="divider"></div>
    <p class="section-title">興趣</p>
    <div class="interests">
      <div class="interest-tag">
        <span class="interest-icon">🏀</span> 打籃球
      </div>
      <div class="interest-tag">
        <span class="interest-icon">📷</span> 攝影
      </div>
    </div>
    <p class="footer">歡迎來到我的個人網頁</p>
  </div>
</body>
</html>
